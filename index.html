<!doctype html>
<html lang="en"><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Electronic clock</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-content:center;background:#181a1b;color:#bfc0bd;font:14px system-ui;text-align:center}
canvas{width:min(90vw,640px);height:auto;background:black;border:1px solid #303234;border-radius:10px}
p{max-width:600px;padding:0 12px;line-height:1.8}a{color:inherit;margin:0 8px}
</style>
<canvas id="clock" width="320" height="240" aria-label="Electronic clock"></canvas>
<p>Warm white · smooth typography · quiet display<br>
<a href="?time=09:41">9:41</a><a href="?time=10:58">10:58</a><a href="?time=11:59">11:59</a><a href="?time=12:00">12:00</a><a href="?time=23:59&offline=1">Offline</a>
<br>Exact firmware glyphs. Browser local time.</p>
<script src="assets/font-data.js"></script>
<script>
const DIGIT_GAP = 6, DIGIT_Y = 18;
function clockDigits(h,m) { return `${h%12||12}:${String(m).padStart(2,'0')}`; }
function textWidth(text,large) {
  return [...text].reduce((w,c)=>w+CLOCK_FONT[(large?'large_':'small_')+c].advance,0)+(large?DIGIT_GAP*(text.length-1):0);
}
function layout(text,large,x,y) {
  return [...text].map(c=>{
    const g=CLOCK_FONT[(large?'large_':'small_')+c];
    const result={g,x,y}; x+=g.advance+(large?DIGIT_GAP:0); return result;
  });
}
const cv=document.getElementById('clock'),ctx=cv.getContext('2d');
const params=new URLSearchParams(location.search),fixed=params.get('time');
const cache=new Map();
function drawText(text,large,x,y) {
  for (const item of layout(text,large,x,y)) {
    const {g}=item;
    if (!cache.has(g)) {
      const canvas=document.createElement('canvas'); canvas.width=g.w; canvas.height=g.h;
      const gc=canvas.getContext('2d'), pixels=gc.createImageData(g.w,g.h),data=atob(g.data);
      const color=large?[245,241,232]:[214,215,211];
      for(let i=0;i<data.length;i++) {
        const a=data.charCodeAt(i);
        // Match the firmware's RGB565 quantization, including softened edges.
        const rgb=color.map(c=>Math.floor(c*a/15));
        pixels.data[i*4]=Math.round((rgb[0]>>3)*255/31);
        pixels.data[i*4+1]=Math.round((rgb[1]>>2)*255/63);
        pixels.data[i*4+2]=Math.round((rgb[2]>>3)*255/31);
        pixels.data[i*4+3]=255;
      }
      gc.putImageData(pixels,0,0);cache.set(g,canvas);
    }
    ctx.drawImage(cache.get(g),item.x,item.y);
  }
}
function render() {
  const now=new Date();
  if(fixed && /^(?:[01]?[0-9]|2[0-3]):[0-5][0-9]$/.test(fixed)) {
    const [h,m]=fixed.split(':').map(Number);now.setHours(h,m,0,0);
  }
  ctx.fillStyle='#000';ctx.fillRect(0,0,320,240);
  const digits=clockDigits(now.getHours(),now.getMinutes());
  drawText(digits,true,Math.floor((320-textWidth(digits,true))/2),DIGIT_Y);
  const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const months=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const footer=params.has('offline')?'Offline':`${days[now.getDay()]}, ${months[now.getMonth()]} ${now.getDate()}`;
  drawText(footer,false,12,200);
  const period=now.getHours()>=12?'PM':'AM';
  drawText(period,false,308-textWidth(period,false),200);
}
render();setInterval(render,1000);
</script></html>

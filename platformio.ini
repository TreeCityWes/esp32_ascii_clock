; ESP32-2432S028R / S029R ("Cheap Yellow Display") — electronic clock
[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; Optional serial port overrides (otherwise auto-detected):
; upload_port = COM3
; monitor_port = COM3
board_build.partitions = min_spiffs.csv

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    tzapu/WiFiManager@^2.0.17

build_flags =
    -Os
    ; --- TFT_eSPI pin/driver setup for the CYD (HSPI) ---
    ; See README "Display variants" if colors are wrong on your revision.
    -DUSER_SETUP_LOADED=1
    -DILI9341_2_DRIVER=1
    -DINVERT_DISPLAY=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_RGB_ORDER=TFT_BGR
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DTFT_BACKLIGHT_ON=HIGH
    -DUSE_HSPI_PORT=1
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DSMOOTH_FONT=1
    ; --- app config ---
    -DTZ_POSIX=\"EST5EDT,M3.2.0,M11.1.0\"
    -DAP_NAME=\"ascii-clock\"
